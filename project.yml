name: ChessCoach
options:
  bundleIdPrefix: com.chesscoach
  deploymentTarget:
    iOS: "16.0"
packages:
  ChessKitEngine:
    url: https://github.com/chesskit-app/chesskit-engine
    from: 0.7.0
targets:
  ChessCoach:
    type: application
    platform: iOS
    sources:
      - path: Sources/ChessCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chesscoach.app
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: ChessKitEngine